<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#1f4e78">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="바코드검사">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>바코드 검사</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1b2330;--sub:#5f6b7a;--line:#d9dee5;--pri:#1f4e78;--ok:#1e8e3e;--ng:#d93025;--warn:#f29900}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--pri);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:8px}
header h1{font-size:17px;margin:0;flex:1}
header small{opacity:.85}
main{padding:16px;max-width:640px;margin:0 auto}
section{display:none}section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
input,select,textarea{width:100%;font-size:17px;padding:11px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
button{font-size:16px;border:0;border-radius:10px;padding:13px 14px;background:var(--pri);color:#fff;font-weight:600;cursor:pointer}
button.sec{background:#e8edf3;color:var(--pri)}button.ok{background:var(--ok)}button.red{background:var(--ng)}button.full{width:100%}
.row{display:flex;gap:8px}.row>*{flex:1}
.seg{display:flex;gap:8px}.seg button{flex:1;background:#e8edf3;color:var(--pri)}.seg button.on{background:var(--pri);color:#fff}
.list{max-height:55vh;overflow:auto}
.item{padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.item b{display:block}.item span{font-size:13px;color:var(--sub)}
.tag{display:inline-block;font-size:12px;padding:1px 7px;border-radius:9px;background:#e8edf3;color:var(--pri);margin-left:4px}
.tag.no{background:#fde7e5;color:var(--ng)}
#reader{width:100%;border-radius:10px;overflow:hidden;background:#000;min-height:200px}
.result{border-radius:14px;padding:16px;color:#fff;text-align:center;margin-bottom:12px}
.result h2{margin:0 0 4px;font-size:24px}.result p{margin:2px 0;font-size:20px;letter-spacing:.5px}
.r-ok{background:var(--ok)}.r-ng{background:var(--ng)}.r-warn{background:var(--warn)}.r-info{background:var(--pri)}
.info{border:2px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff;cursor:pointer}
.info.pick{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri) inset}
.info .nm{font-size:19px;font-weight:700;margin-bottom:6px}
.info table{width:100%;border-collapse:collapse;font-size:15px}
.info td{padding:3px 0;vertical-align:top}.info td:first-child{color:var(--sub);width:78px}
.muted{color:var(--sub);font-size:13px}
.toast{position:fixed;left:16px;right:16px;bottom:18px;background:#222;color:#fff;padding:12px 14px;border-radius:10px;display:none;z-index:20;text-align:center}
.badge{background:#fff;color:var(--pri);border-radius:10px;padding:1px 8px;font-size:13px;font-weight:700}
.thumb{max-width:120px;border-radius:8px;margin-top:8px;display:none}
.hide{display:none!important}
</style>
</head>
<body>
<header><h1 id="hdr">바코드 검사</h1><small id="who"></small><span id="q" class="badge hide"></span></header>
<main>

<!-- PIN -->
<section id="s-pin" class="on">
  <div class="card">
    <h3 style="margin-top:0">팀 PIN 입력</h3>
    <input id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="PIN">
    <div style="height:10px"></div>
    <button class="full" onclick="login()">시작</button>
    <p id="demoNote" class="muted hide">※ 시연 모드입니다 (서버 미연결). PIN 아무거나 입력.</p>
  </div>
</section>

<!-- 검사자·구분 -->
<section id="s-user">
  <div class="card">
    <label>검사자</label><select id="user"></select>
    <label>구분</label>
    <div class="seg" id="modeSeg"><button data-m="자재입고" class="on">자재 입고</button><button data-m="완제품">완제품 검사</button></div>
    <div style="height:14px"></div>
    <button class="full" onclick="toHome()">검사 시작</button>
    <p class="muted" id="mInfo"></p>
  </div>
</section>

<!-- 스캔 (기본 화면) -->
<section id="s-scan">
  <div class="card" id="selCard"></div>
  <div class="card" id="lotCard">
    <div class="row"><div><label>LOT</label><input id="lot"></div><div><label>수량</label><input id="qty" inputmode="numeric"></div></div>
    <p class="muted" id="sess"></p>
  </div>
  <div id="reader"></div>
  <div class="row" style="margin-top:8px">
    <button class="sec" onclick="torch()">플래시</button>
    <button class="sec" onclick="manual()">숫자 입력</button>
  </div>
  <div id="homeBtns">
    <div class="row" style="margin-top:8px">
      <button class="sec" onclick="openSearch()">품목 검색</button>
      <button class="sec" onclick="openReg()">신규 등록</button>
    </div>
    <div class="row" style="margin-top:8px">
      <button class="sec" onclick="show('s-user')">검사자 변경</button>
      <button class="sec" onclick="openAdmin()">관리자</button>
    </div>
  </div>
  <button id="backFromScan" class="sec full hide" style="margin-top:8px" onclick="goBack()">← 입력 화면으로</button>
</section>

<!-- 조회 결과 -->
<section id="s-res">
  <div id="resBox" class="result"></div>
  <div id="resItems"></div>
  <div class="card">
    <label>비고</label><input id="note">
    <div style="margin-top:8px"><button class="sec full" onclick="takePhoto('res')">📷 사진 촬영</button></div>
    <img id="resThumb" class="thumb">
    <div id="resActs" style="margin-top:10px"></div>
    <div id="resExtra" style="margin-top:8px"></div>
  </div>
  <button class="sec full" onclick="toHome()">← 다시 스캔 (저장 안 함)</button>
</section>

<!-- 품목 검색 -->
<section id="s-search">
  <div class="card">
    <p id="linkNote" class="hide" style="margin:0 0 8px;color:var(--pri);font-weight:600"></p>
    <input id="kw" type="search" placeholder="자재코드 또는 품명 검색" autocomplete="off">
    <div class="list" id="list"></div>
  </div>
  <button class="sec full" onclick="toHome()">← 스캔 화면으로</button>
</section>

<!-- 품목 상세 (검색에서 선택) -->
<section id="s-item">
  <div id="itemBox"></div>
  <div class="row"><button class="sec" onclick="openEdit(S.viewCode)">품목 수정 (수정 PIN)</button></div>
  <div style="height:8px"></div>
  <div class="row"><button class="sec" onclick="openSearch(true)">← 검색 결과</button><button class="sec" onclick="toHome()">스캔 화면</button></div>
</section>

<!-- 신규 등록 -->
<section id="s-reg">
  <div class="card">
    <h3 style="margin-top:0">신규 등록 <span class="muted">(팀 PIN)</span></h3>
    <label>자재코드</label><input id="rCode">
    <label>품명</label><input id="rName">
    <label>바코드</label><div class="row"><input id="rBc" inputmode="numeric"><button class="sec" style="flex:0 0 90px" onclick="scanInto('rBc')">스캔</button></div>
    <label>관리유형 (예: 단상자, 라벨)</label><input id="rType">
    <label>고객사</label><input id="rCust">
    <div class="row" style="margin-top:12px"><button class="sec" onclick="takePhoto('reg')">📷 사진</button><button onclick="doReg()">등록</button></div>
    <img id="regThumb" class="thumb">
  </div>
  <button class="sec full" onclick="toHome()">취소</button>
</section>

<!-- 수정 -->
<section id="s-edit">
  <div class="card">
    <h3 style="margin-top:0">품목 수정 <span class="muted">(수정 PIN)</span></h3>
    <p id="eHead"></p>
    <label>바코드</label><div class="row"><input id="eBc" inputmode="numeric"><button class="sec" style="flex:0 0 90px" onclick="scanInto('eBc')">스캔</button></div>
    <label>품명</label><input id="eName">
    <label>사용여부</label><select id="eUse"><option value="Y">사용</option><option value="N">사용중지</option></select>
    <label>수정 사유</label>
    <select id="eReason"><option value="">선택</option><option>오등록 정정</option><option>A/W 개정</option><option>바코드 변경</option><option>단종</option><option>기타</option></select>
    <input id="eReasonTxt" class="hide" placeholder="사유 직접 입력" style="margin-top:6px">
    <label>수정 PIN</label><input id="ePin" type="password" inputmode="numeric" maxlength="8">
    <div class="row" style="margin-top:12px"><button class="sec" onclick="takePhoto('edit')">📷 근거 사진</button><button onclick="doEdit()">수정 저장</button></div>
    <img id="editThumb" class="thumb">
  </div>
  <button class="sec full" onclick="toHome()">취소</button>
</section>

<!-- 관리자 -->
<section id="s-admin">
  <div class="card" id="admLogin">
    <h3 style="margin-top:0">관리자</h3>
    <input id="aPin" type="password" inputmode="numeric" maxlength="8" placeholder="관리자 PIN">
    <div style="height:10px"></div><button class="full" onclick="admLogin()">확인</button>
  </div>
  <div id="admBody" class="hide">
    <div class="card">
      <h4 style="margin:0 0 6px">PIN 변경</h4>
      <select id="aWhich"><option value="team">팀 PIN</option><option value="edit">수정 PIN</option><option value="admin">관리자 PIN</option></select>
      <input id="aNew" type="password" inputmode="numeric" maxlength="8" placeholder="새 PIN (숫자 4~8자리)" style="margin-top:6px">
      <div style="height:8px"></div><button class="full" onclick="setPin()">변경</button>
    </div>
    <div class="card">
      <h4 style="margin:0 0 6px">검사자 목록</h4>
      <p class="muted">한 줄에 한 명: 이름, 파트, 사용여부(Y/N)</p>
      <textarea id="aUsers" rows="8"></textarea>
      <div style="height:8px"></div><button class="full" onclick="setUsers()">저장</button>
    </div>
  </div>
  <button class="sec full" onclick="toHome()">닫기</button>
</section>

<input id="photoIn" type="file" accept="image/*" capture="environment" class="hide">
</main>
<div class="toast" id="toast"></div>

<script>
/* ===== 설정: Apps Script 웹앱 URL을 붙여 넣으세요. 비워 두면 시연 모드 ===== */
const API_URL = 'https://script.google.com/macros/s/AKfycbz6ISZQ8zW0AaFU_uPryyaEJ78TTNnNhl7N7f9cF9EmZzBqaABOVhW0k9uUoE4NM0uP/exec';

const DEMO = !API_URL;
const $ = id => document.getElementById(id);
const S = { pin: '', user: '', mode: '자재입고', master: [], byCode: {}, byBc: {}, last: null, pick: null, viewCode: null, linkBc: null,
  photo: { res: null, reg: null, edit: null }, photoFor: null, sess: { n: 0, ok: 0, ng: 0 }, scanner: null, scanTarget: null };
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
};
const device = store.get('bq_dev') || (() => { const d = 'D' + Math.random().toString(36).slice(2, 8).toUpperCase(); store.set('bq_dev', d); return d; })();
let memQueue = [];

function toast(m, ms) { const t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', ms || 2200); }
function show(id) { document.querySelectorAll('section').forEach(s => s.classList.toggle('on', s.id === id)); window.scrollTo(0, 0); if (id !== 's-scan') stopScan(); }
const digits = s => String(s || '').replace(/\D/g, '');
const norm = s => { const d = digits(s); return d.length === 12 ? '0' + d : d; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const now = () => { const d = new Date(), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; };
const short = t => [...new Set(String(t || '').replace(/^\[[^\]]+\]/, '').split('_').slice(1))].join(' · ') || t || '';
function beep(ok) { try { const a = new (window.AudioContext || window.webkitAudioContext)(), o = a.createOscillator(), g = a.createGain(); o.connect(g); g.connect(a.destination); o.frequency.value = ok ? 880 : 220; g.gain.value = .2; o.start(); o.stop(a.currentTime + (ok ? .15 : .6)); } catch (e) {} if (navigator.vibrate) navigator.vibrate(ok ? 60 : [200, 80, 200]); }

/* ===== 서버 통신 ===== */
async function api(action, data) {
  if (DEMO) return demoApi(action, data || {});
  const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action, device, pin: S.pin, user: S.user }, data)) });
  return r.json();
}

/* ===== 로그인 ===== */
async function login() {
  S.pin = $('pin').value.trim();
  if (!S.pin) return toast('PIN을 입력하세요');
  try {
    const r = await api('init');
    if (!r.ok) return toast(r.msg);
    $('user').innerHTML = r.users.map(u => `<option>${esc(u.name)}</option>`).join('');
    const lu = store.get('bq_user'); if (lu) $('user').value = lu;
    S.mode = store.get('bq_mode', '자재입고'); paintMode();
    show('s-user');
    loadMaster(r.version);
  } catch (e) { toast('서버 연결 실패: 네트워크를 확인하세요'); }
}
function paintMode() { document.querySelectorAll('#modeSeg button').forEach(b => b.classList.toggle('on', b.dataset.m === S.mode)); }
$('modeSeg').onclick = e => { if (e.target.dataset.m) { S.mode = e.target.dataset.m; paintMode(); } };
function toHome() {
  if (!S.user || document.querySelector('section.on').id === 's-user') {
    S.user = $('user').value; store.set('bq_user', S.user); store.set('bq_mode', S.mode);
    $('who').textContent = `${S.user} · ${S.mode === '완제품' ? '완제품' : '자재입고'}`;
  }
  S.linkBc = null; S.scanTarget = null;
  $('selCard').innerHTML = '<b>바코드를 비추세요</b><div class="muted">찍으면 DB에 등록된 품목 정보가 나옵니다</div>';
  $('lotCard').classList.remove('hide'); $('homeBtns').classList.remove('hide'); $('backFromScan').classList.add('hide');
  paintSess(); show('s-scan'); runScanner(onScan);
}

/* ===== 마스터 ===== */
async function loadMaster(ver) {
  const c = store.get('bq_master');
  if (c && String(c.version) === String(ver)) { setMaster(c.rows); return; }
  $('mInfo').textContent = 'DB 불러오는 중…';
  const r = await api('master');
  if (!r.ok) return toast(r.msg);
  setMaster(r.rows);
  if (!store.set('bq_master', { version: r.version, rows: r.rows })) console.log('마스터 캐시 저장 생략');
}
function setMaster(rows) {
  S.master = rows; S.byCode = {}; S.byBc = {};
  rows.forEach(x => { S.byCode[x[0]] = x; if (x[1]) (S.byBc[norm(x[1])] = S.byBc[norm(x[1])] || []).push(x[0]); });
  const nb = rows.filter(x => x[1]).length;
  $('mInfo').textContent = `DB ${rows.length.toLocaleString()}개 품목 (바코드 ${nb.toLocaleString()}개)`;
}
async function refreshMaster(ver) { store.set('bq_master', null); await loadMaster(ver); }

/* ===== 품목 정보 카드 ===== */
function infoCard(x, pickable) {
  return `<div class="info${S.pick === x[0] ? ' pick' : ''}" ${pickable ? `data-c="${esc(x[0])}"` : ''}>
    <div class="nm">${esc(x[2])}</div>
    <table>
      <tr><td>자재코드</td><td><b>${esc(x[0])}</b></td></tr>
      <tr><td>구분</td><td>${esc(short(x[3]))}</td></tr>
      <tr><td>고객사</td><td>${esc(x[4] || '-')}</td></tr>
      <tr><td>바코드</td><td>${x[1] ? esc(x[1]) : '<span style="color:var(--ng)">미등록</span>'}</td></tr>
      ${x[5] === 'N' ? '<tr><td>상태</td><td><span class="tag no">사용중지 품목</span></td></tr>' : ''}
    </table></div>`;
}

/* ===== 스캔 ===== */
function paintSess() { $('sess').textContent = S.sess.n ? `오늘 이 화면 누계: ${S.sess.n}건 (일치 ${S.sess.ok} / 불일치·미등록 ${S.sess.ng})` : ''; }
async function runScanner(cb) {
  await stopScan();
  if (!window.Html5Qrcode) { toast('스캐너를 불러오지 못했습니다. [숫자 입력]을 사용하세요'); return; }
  const F = Html5QrcodeSupportedFormats;
  S.scanner = new Html5Qrcode('reader', { formatsToSupport: [F.EAN_13, F.UPC_A, F.EAN_8, F.UPC_E, F.CODE_128, F.CODE_39, F.QR_CODE], experimentalFeatures: { useBarCodeDetectorIfSupported: true }, verbose: false });
  S.scanner.start({ facingMode: 'environment' }, { fps: 12, qrbox: (w, h) => ({ width: Math.min(w * .9, 340), height: Math.min(h * .45, 160) }) },
    txt => { stopScan(); cb(txt, '스캔'); }, () => {})
    .catch(() => toast('카메라를 열 수 없습니다. 권한을 허용하거나 [숫자 입력]을 사용하세요', 3500));
}
async function stopScan() { const s = S.scanner; S.scanner = null; if (s) { try { await s.stop(); s.clear(); } catch (e) {} } }
async function torch() { try { const s = S.scanner; S._torch = !S._torch; await s.applyVideoConstraints({ advanced: [{ torch: S._torch }] }); } catch (e) { toast('이 기기는 플래시 제어를 지원하지 않습니다'); } }
function manual() { const v = prompt('바코드 숫자 입력'); if (v && digits(v)) { stopScan(); (S.scanTarget ? fillTarget : onScan)(v, '수기입력'); } }

function onScan(raw, method) {
  const bc = digits(raw) || String(raw).trim();
  const hits = (S.byBc[norm(bc)] || []).map(c => S.byCode[c]);
  S.last = { bc, method, hits };
  S.pick = hits.length === 1 ? hits[0][0] : null;
  S.photo.res = null; S.pendingSave = null; $('resThumb').style.display = 'none'; $('note').value = '';
  const stopped = hits.length && hits.every(x => x[5] === 'N');
  if (!hits.length) {
    $('resBox').className = 'result r-warn';
    $('resBox').innerHTML = `<h2>미등록 바코드</h2><p>${esc(bc)}</p>`;
  } else if (stopped) {
    $('resBox').className = 'result r-ng';
    $('resBox').innerHTML = `<h2>사용중지 품목</h2><p>${esc(bc)}</p>`;
  } else {
    $('resBox').className = 'result r-info';
    $('resBox').innerHTML = `<h2>${hits.length > 1 ? `등록 품목 ${hits.length}개` : '등록 품목'}</h2><p>${esc(bc)}</p>`;
  }
  beep(hits.length && !stopped);
  paintItems();
  if (hits.length) {
    $('resActs').innerHTML = `<p class="muted" style="margin:0 0 6px">실물(입고 자재·제품)과 위 정보를 비교한 뒤 누르세요</p>
      <div class="row"><button class="ok" onclick="saveInspect('일치')">✔ 일치 – 저장</button><button class="red" onclick="saveInspect('불일치')">✖ 불일치 – 저장</button></div>`;
    $('resExtra').innerHTML = '';
  } else {
    $('resActs').innerHTML = `<button class="red full" onclick="saveInspect('미등록')">미등록으로 기록 저장</button>`;
    $('resExtra').innerHTML = `<div class="row"><button class="sec" onclick="openReg('${esc(bc)}')">이 바코드로 신규 품목 등록</button><button class="sec" onclick="linkToItem()">기존 품목에 연결</button></div>`;
  }
  show('s-res');
}
function paintItems() {
  const h = S.last.hits;
  $('resItems').innerHTML = (h.length > 1 ? '<p class="muted" style="margin:0 0 6px">같은 바코드를 쓰는 품목입니다. 실물에 해당하는 품목을 눌러 선택하세요.</p>' : '')
    + h.map(x => infoCard(x, h.length > 1)).join('');
}
$('resItems').onclick = e => { const c = e.target.closest('.info'); if (c && c.dataset.c) { S.pick = c.dataset.c; paintItems(); } };

/* ===== 검사 저장 (오프라인 대기열) ===== */
function saveInspect(kind) {
  const L = S.last; if (!L) return;
  if (L.hits.length > 1 && !S.pick && kind === '일치') return toast('해당 품목을 먼저 선택하세요');
  if (kind !== '일치' && !S.photo.res) { S.pendingSave = kind; toast('불일치·미등록은 사진이 필요합니다'); return takePhoto('res'); }
  S.pendingSave = null;
  const sel = S.pick ? S.byCode[S.pick] : null;
  const verdict = { 일치: '적합(정보 일치)', 불일치: '부적합(정보 불일치)', 미등록: '부적합(미등록 바코드)' }[kind];
  const rec = { time: now(), mode: S.mode, user: S.user, selCode: sel ? sel[0] : '', selName: sel ? sel[2] : '', scanned: L.bc,
    verdict, matched: L.hits.map(x => `${x[0]} ${x[2]}`).join(' | '), method: L.method, lot: $('lot').value, qty: $('qty').value, note: $('note').value };
  enqueue({ action: 'inspect', rec, photo: S.photo.res });
  S.sess.n++; kind === '일치' ? S.sess.ok++ : S.sess.ng++;
  toast('저장됨'); toHome();
}
function enqueue(job) {
  const q = store.get('bq_queue', []); q.push(job);
  if (!store.set('bq_queue', q)) { memQueue.push(job); }
  flush();
}
let flushing = false;
async function flush() {
  if (flushing) return; flushing = true;
  try {
    while (true) {
      const q = store.get('bq_queue', []), fromMem = !q.length && memQueue.length;
      const job = q.length ? q[0] : memQueue[0];
      if (!job) break;
      const r = await api(job.action, job);
      if (!r.ok) { toast('기록 저장 실패: ' + r.msg, 3500); break; }
      if (fromMem) memQueue.shift(); else { q.shift(); store.set('bq_queue', q); }
    }
  } catch (e) { /* 오프라인: 다음에 재시도 */ }
  flushing = false; paintQ();
}
function paintQ() { const n = store.get('bq_queue', []).length + memQueue.length; $('q').textContent = '미전송 ' + n; $('q').classList.toggle('hide', !n); }
window.addEventListener('online', flush); setInterval(flush, 30000);

/* ===== 사진 (압축 후 전송) ===== */
function takePhoto(target) { S.photoFor = target; $('photoIn').value = ''; $('photoIn').click(); }
$('photoIn').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const img = new Image(), url = URL.createObjectURL(f);
  img.onload = () => {
    const m = 1280, k = Math.min(1, m / Math.max(img.width, img.height)), c = document.createElement('canvas');
    c.width = img.width * k; c.height = img.height * k; c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const d = c.toDataURL('image/jpeg', .7); URL.revokeObjectURL(url);
    S.photo[S.photoFor] = d; const th = $({ res: 'resThumb', reg: 'regThumb', edit: 'editThumb' }[S.photoFor]); th.src = d; th.style.display = 'block';
    if (S.photoFor === 'res' && S.pendingSave) saveInspect(S.pendingSave);
  };
  img.src = url;
};

/* ===== 품목 검색 ===== */
function openSearch(keep) {
  if (!keep) $('kw').value = '';
  $('linkNote').classList.toggle('hide', !S.linkBc);
  if (S.linkBc) $('linkNote').textContent = `바코드 ${S.linkBc} 를 연결할 품목을 고르세요`;
  show('s-search'); renderList(); $('kw').focus();
}
$('kw').addEventListener('input', renderList);
function renderList() {
  const kw = $('kw').value.trim().toLowerCase().replace(/\s+/g, '');
  const el = $('list');
  if (!kw) { el.innerHTML = '<p class="muted">자재코드나 품명 일부를 입력하세요. 예) 단상자, 5006391</p>'; return; }
  const hit = [];
  for (const x of S.master) {
    if (x[0].includes(kw) || String(x[2]).toLowerCase().replace(/\s+/g, '').includes(kw)) { hit.push(x); if (hit.length >= 80) break; }
  }
  el.innerHTML = hit.length ? hit.map(x => `<div class="item" data-c="${esc(x[0])}"><b>${esc(x[2])}</b><span>${esc(x[0])} · ${esc(short(x[3]))}${x[4] ? ' · ' + esc(x[4]) : ''}${x[1] ? '<span class="tag">' + esc(x[1]) + '</span>' : '<span class="tag no">바코드 없음</span>'}${x[5] === 'N' ? '<span class="tag no">사용중지</span>' : ''}</span></div>`).join('')
    : '<p class="muted">검색 결과 없음 → [신규 등록]</p>';
}
$('list').onclick = e => {
  const it = e.target.closest('.item'); if (!it) return;
  const x = S.byCode[it.dataset.c];
  if (S.linkBc) return linkPick(x);
  S.viewCode = x[0]; $('itemBox').innerHTML = infoCard(x, false); show('s-item');
};

/* ===== 미등록 바코드를 기존 품목에 연결 ===== */
function linkToItem() { S.linkBc = S.last.bc; openSearch(); }
async function linkPick(x) {
  const bc = S.linkBc;
  if (x[1]) { S.linkBc = null; return openEdit(x[0], bc); }  // 기존 바코드 교체 → 수정 PIN
  if (!confirm(`${x[2]}\n바코드 ${bc} 를 등록할까요?`)) return;
  const send = force => api('register', { item: { code: x[0], barcode: bc }, photo: S.photo.res, reason: '검사 중 바코드 최초 등록', force });
  let r = await send(false);
  if (r.confirm) { if (!confirm('같은 바코드를 쓰는 품목이 있습니다:\n' + r.dup.join('\n') + '\n\n계속할까요?')) return; r = await send(true); }
  S.linkBc = null; afterWrite(r);
}

/* ===== 바코드를 입력칸에 스캔 ===== */
let prevSection = null;
function scanInto(fieldId) {
  prevSection = document.querySelector('section.on').id; S.scanTarget = fieldId;
  $('selCard').innerHTML = '<b>등록할 바코드를 비추세요</b>';
  $('lotCard').classList.add('hide'); $('homeBtns').classList.add('hide'); $('backFromScan').classList.remove('hide');
  show('s-scan'); runScanner(fillTarget);
}
function fillTarget(raw) { const f = S.scanTarget; S.scanTarget = null; show(prevSection); $(f).value = digits(raw) || raw; }
function goBack() { if (S.scanTarget) { S.scanTarget = null; show(prevSection); } else toHome(); }

/* ===== 신규 등록 ===== */
function openReg(bc) {
  ['rCode', 'rName', 'rBc', 'rType', 'rCust'].forEach(i => $(i).value = '');
  if (bc) $('rBc').value = bc; S.photo.reg = S.photo.res || null;
  $('regThumb').style.display = S.photo.reg ? 'block' : 'none'; if (S.photo.reg) $('regThumb').src = S.photo.reg;
  show('s-reg');
}
async function doReg(force) {
  const item = { code: $('rCode').value.trim(), name: $('rName').value.trim(), barcode: $('rBc').value.trim(), type: $('rType').value.trim(), customer: $('rCust').value.trim() };
  if (!item.code || !item.name) return toast('자재코드와 품명은 필수입니다');
  const r = await api('register', { item, photo: S.photo.reg, force: !!force });
  if (r.confirm) { if (confirm('같은 바코드를 쓰는 품목이 있습니다:\n' + r.dup.join('\n') + '\n\n같은 제품의 단상자·라벨이면 정상입니다. 계속할까요?')) return doReg(true); return; }
  afterWrite(r);
}
async function afterWrite(r) {
  if (!r.ok) return toast(r.msg, 3500);
  toast('DB에 반영되었습니다'); await refreshMaster(r.version); toHome();
}

/* ===== 수정 (수정 PIN) ===== */
function openEdit(code, newBc) {
  const x = S.byCode[code]; S.editCode = code;
  $('eHead').innerHTML = `<b>${esc(x[2])}</b><br><span class="muted">${esc(x[0])}</span>`;
  $('eBc').value = newBc || x[1] || ''; $('eName').value = x[2]; $('eUse').value = x[5] === 'N' ? 'N' : 'Y';
  $('eReason').value = newBc ? '바코드 변경' : ''; $('eReasonTxt').value = ''; $('eReasonTxt').classList.add('hide'); $('ePin').value = '';
  S.photo.edit = null; $('editThumb').style.display = 'none'; show('s-edit');
}
$('eReason').onchange = () => $('eReasonTxt').classList.toggle('hide', $('eReason').value !== '기타');
async function doEdit(force) {
  const x = S.byCode[S.editCode], ch = {};
  if (digits($('eBc').value) !== digits(x[1])) ch.barcode = $('eBc').value;
  if ($('eName').value.trim() !== x[2]) ch.name = $('eName').value.trim();
  if ($('eUse').value !== (x[5] === 'N' ? 'N' : 'Y')) ch.use = $('eUse').value;
  if (!Object.keys(ch).length) return toast('바뀐 내용이 없습니다');
  let reason = $('eReason').value; if (reason === '기타') reason = '기타: ' + $('eReasonTxt').value.trim();
  if (!reason || reason === '기타: ') return toast('수정 사유를 선택하세요');
  const ep = $('ePin').value.trim(); if (!ep) return toast('수정 PIN을 입력하세요');
  const r = await api('update', { pin: ep, code: S.editCode, changes: ch, reason, photo: S.photo.edit, force: !!force });
  if (r.confirm) { if (confirm('같은 바코드를 쓰는 품목이 있습니다:\n' + r.dup.join('\n') + '\n\n계속할까요?')) return doEdit(true); return; }
  if (!r.ok) return toast(r.msg, 3500);
  toast(`수정 완료 (${r.changed}개 항목)`); await refreshMaster(r.version); toHome();
}

/* ===== 관리자 ===== */
function openAdmin() { $('admLogin').classList.remove('hide'); $('admBody').classList.add('hide'); $('aPin').value = ''; show('s-admin'); }
async function admLogin() {
  const r = await api('admin', { pin: $('aPin').value.trim(), op: 'check' });
  if (!r.ok) return toast(r.msg);
  S.adminPin = $('aPin').value.trim();
  $('aUsers').value = r.users.map(u => [u.name, u.part, u.use].join(', ')).join('\n');
  $('admLogin').classList.add('hide'); $('admBody').classList.remove('hide');
}
async function setPin() {
  const v = $('aNew').value.trim(); if (!/^\d{4,8}$/.test(v)) return toast('숫자 4~8자리');
  const r = await api('admin', { pin: S.adminPin, op: 'setPin', which: $('aWhich').value, value: v });
  if (!r.ok) return toast(r.msg);
  toast('PIN이 변경되었습니다'); $('aNew').value = '';
  if ($('aWhich').value === 'team') S.pin = v;
  if ($('aWhich').value === 'admin') S.adminPin = v;
}
async function setUsers() {
  const users = $('aUsers').value.split('\n').map(l => l.split(',').map(s => s.trim())).filter(a => a[0]).map(a => ({ name: a[0], part: a[1] || '', use: (a[2] || 'Y').toUpperCase() }));
  const r = await api('admin', { pin: S.adminPin, op: 'setUsers', users });
  if (!r.ok) return toast(r.msg);
  toast('검사자 목록 저장'); $('user').innerHTML = r.users.filter(u => u.use !== 'N').map(u => `<option>${esc(u.name)}</option>`).join('');
}

/* ===== 폰의 뒤로가기 버튼: 앱을 닫지 않고 이전 화면으로 ===== */
history.pushState(null, '');
window.addEventListener('popstate', () => {
  history.pushState(null, '');
  const cur = document.querySelector('section.on').id;
  if (cur === 's-scan') S.scanTarget ? goBack() : show('s-user');
  else if (cur === 's-item') openSearch(true);
  else if (['s-res', 's-search', 's-reg', 's-edit', 's-admin'].includes(cur)) toHome();
});

/* ===== 시연 모드 (서버 없이 화면 확인용) ===== */
const DEMO_ROWS = [
  ['500639100703', '8809652585932', 'BROW WIZ DELUXE(FG SELLABLE) 단상자(공용)', '[7BK1]포장재_단상자_단상자', 'AS Beauty', 'Y'],
  ['500639025703', '716170365398', 'BROW DEFINER 단상자(공용)', '[7BK1]포장재_단상자_단상자', 'AS Beauty', 'Y'],
  ['534087001701', '8806164161753', 'XMAS24 SF LIP MARKER 02 단상자', '[7CI1]용기(사급)_립마커_용기조립품', '씨티케이', 'Y'],
  ['534087001702', '8806164161753', 'XMAS24 SF LIP MARKER 02 라벨', '[7CI2]용기(사급)_립마커_라벨', '씨티케이', 'Y'],
  ['525204011701', '', 'Peptide Lip Shape 캡(공용)', '[7AA1]용기_립_캡', 'HR BEAUTY (RHODE SKIN)', 'Y']];
let demoVer = 1;
function demoApi(a, d) {
  return new Promise(res => setTimeout(() => {
    if (a === 'init') res({ ok: true, users: [{ name: '시연자' }, { name: '홍길동' }], version: demoVer });
    else if (a === 'master') res({ ok: true, version: demoVer, rows: DEMO_ROWS });
    else if (a === 'update') { const x = DEMO_ROWS.find(r => r[0] === d.code); if (d.changes.barcode !== undefined) x[1] = digits(d.changes.barcode); if (d.changes.name) x[2] = d.changes.name; if (d.changes.use) x[5] = d.changes.use; res({ ok: true, changed: Object.keys(d.changes).length, version: ++demoVer }); }
    else if (a === 'register') { const it = d.item, x = DEMO_ROWS.find(r => r[0] === it.code); if (x) x[1] = digits(it.barcode); else DEMO_ROWS.push([it.code, digits(it.barcode), it.name, it.type, it.customer, 'Y']); res({ ok: true, version: ++demoVer }); }
    else if (a === 'admin') res({ ok: true, users: [{ name: '시연자', part: '자재입고', use: 'Y' }] });
    else res({ ok: true });
  }, 200));
}
if (DEMO) { $('demoNote').classList.remove('hide'); $('hdr').textContent = '바코드 검사 (시연)'; }
paintQ();
</script>
